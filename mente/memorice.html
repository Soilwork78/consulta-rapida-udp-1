<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Memorice de la Tarde</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/comun.css">
<script src="assets/comun.js"></script>
<style>
.barra-juego{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;margin-bottom:18px}
.mesa{display:grid;gap:12px;grid-template-columns:repeat(var(--cols),minmax(0,1fr));max-width:calc(var(--cols) * 130px);margin:0 auto;perspective:1000px}
.carta{aspect-ratio:3/4;border:0;padding:0;background:transparent;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.carta.vista,.carta.hecha{transform:rotateY(180deg)}
.cara{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.dorso{background:
  radial-gradient(circle at 50% 50%,rgba(255,255,255,.22) 0 18%,transparent 19%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 8px,transparent 8px 16px),
  linear-gradient(145deg,#6d3fe0,#3a1d8f);
  border:3px solid #fff;box-shadow:0 8px 18px -8px rgba(40,10,90,.7)}
.frente{transform:rotateY(180deg);background:var(--card);border:3px solid var(--line);box-shadow:0 8px 18px -8px rgba(0,0,0,.4)}
.frente svg{width:62%;height:62%}
.carta.hecha .frente{border-color:var(--ok);animation:brilla .6s ease}
.carta.falla .frente{border-color:var(--bad)}
@keyframes brilla{50%{box-shadow:0 0 0 6px color-mix(in srgb, var(--ok) 40%, transparent)}}
</style>
</head>
<body>
<div id="mente-bar"></div>
<main class="mjuego">
  <div class="mjuego-head">
    <div><h1>Memorice</h1><p>Da vuelta dos cartas por turno. Si son iguales, quedan descubiertas. Menos movimientos, más puntos.</p></div>
    <div class="mseg" id="niveles" role="group" aria-label="Tamaño"></div>
  </div>
  <div class="mcard barra-juego">
    <div class="mfila">
      <div class="mstat"><b id="mov">0</b><small>Movimientos</small></div>
      <div class="mstat"><b id="pares">0</b><small>Parejas</small></div>
      <div class="mstat"><b id="tiempo">00:00</b><small>Tiempo</small></div>
    </div>
    <button type="button" class="mbtn mbtn-pri" id="nuevo">Repartir de nuevo</button>
  </div>
  <div class="mesa" id="mesa"></div>
</main>
<script>
(function(){
"use strict";
var M = window.Mente; M.barra("memorice");
var $ = function(id){ return document.getElementById(id); };
var FIG = [
  ["#e4572e",'<circle cx="50" cy="50" r="36"/>'],
  ["#2f6fde",'<rect x="16" y="16" width="68" height="68" rx="10"/>'],
  ["#0e9f6e",'<path d="M50 12 88 84H12z"/>'],
  ["#e8a317",'<path d="m50 8 11 26 28 3-21 19 6 28-24-15-24 15 6-28L11 37l28-3z"/>'],
  ["#d6336c",'<path d="M50 86S12 62 12 36a19 19 0 0 1 38-6 19 19 0 0 1 38 6c0 26-38 50-38 50z"/>'],
  ["#7c5cff",'<path d="M50 8 88 50 50 92 12 50z"/>'],
  ["#0b8bb5",'<path d="M50 10C70 40 78 52 78 64a28 28 0 0 1-56 0c0-12 8-24 28-54z"/>'],
  ["#5b8c2a",'<path d="M20 80C20 40 45 18 84 16 82 55 60 80 20 80zM22 78 60 40"/><path d="M22 78 60 40" stroke="#fff" stroke-width="4" fill="none"/>'],
  ["#c2410c",'<path d="M56 6 20 56h26L40 94l40-54H52z"/>'],
  ["#334155",'<path d="M62 12a38 38 0 1 0 26 52A30 30 0 0 1 62 12z"/>'],
  ["#be123c",'<path d="M38 12h24v26h26v24H62v26H38V62H12V38h26z"/>'],
  ["#0f766e",'<circle cx="50" cy="50" r="36" fill="none" stroke="#0f766e" stroke-width="12"/><circle cx="50" cy="50" r="10"/>']
];
var NIV = [{n:"6 parejas",p:6,c:4},{n:"8 parejas",p:8,c:4},{n:"12 parejas",p:12,c:6}];
var S, abiertas = [], bloqueo = false, nivelK = (M.leerLocal("mente.memorice.nivel") ?? 1);

NIV.forEach(function(nv,k){
  var b = document.createElement("button"); b.type="button"; b.textContent=nv.n; b.dataset.k=k;
  b.onclick = function(){ nivelK = +this.dataset.k; M.guardarLocal("mente.memorice.nivel", nivelK); repartir(); };
  $("niveles").appendChild(b);
});

function svg(f){ return '<svg viewBox="0 0 100 100" fill="'+f[0]+'">'+f[1]+'</svg>'; }

function repartir(){
  var nv = NIV[nivelK];
  var ids = M.barajar(FIG.map(function(_,i){ return i; })).slice(0, nv.p);
  var mazo = M.barajar(ids.concat(ids));
  S = { mazo:mazo, hechas:[], mov:0, t:0, fin:false };
  abiertas = []; bloqueo = false;
  var mesa = $("mesa"); mesa.innerHTML = ""; mesa.style.setProperty("--cols", nv.c);
  if(innerWidth < 520 && nv.c === 6) mesa.style.setProperty("--cols", 4);
  mazo.forEach(function(id,i){
    var b = document.createElement("button");
    b.type = "button"; b.className = "carta"; b.dataset.i = i;
    b.setAttribute("aria-label","Carta " + (i+1));
    b.innerHTML = '<span class="cara dorso"></span><span class="cara frente">' + svg(FIG[id]) + '</span>';
    b.onclick = function(){ tocar(+this.dataset.i); };
    mesa.appendChild(b);
  });
  document.querySelectorAll("#niveles button").forEach(function(b){ b.setAttribute("aria-pressed", +b.dataset.k === nivelK ? "true" : "false"); });
  cifras();
}
function carta(i){ return $("mesa").children[i]; }
function tocar(i){
  if(bloqueo || S.fin || S.hechas.indexOf(i) >= 0 || abiertas.indexOf(i) >= 0) return;
  abiertas.push(i); carta(i).classList.add("vista"); M.tono(440, 70, "triangle", 0.04);
  if(abiertas.length < 2) return;
  S.mov++;
  var a = abiertas[0], b = abiertas[1];
  if(S.mazo[a] === S.mazo[b]){
    S.hechas.push(a, b); abiertas = [];
    [a,b].forEach(function(k){ carta(k).classList.add("hecha"); });
    M.tono(660, 120, "sine", 0.06); setTimeout(function(){ M.tono(880, 160, "sine", 0.06); }, 110);
    cifras();
    if(S.hechas.length === S.mazo.length) terminar();
  } else {
    bloqueo = true;
    [a,b].forEach(function(k){ carta(k).classList.add("falla"); });
    setTimeout(function(){
      [a,b].forEach(function(k){ carta(k).classList.remove("vista","falla"); });
      abiertas = []; bloqueo = false;
    }, 850);
    cifras();
  }
}
function terminar(){
  S.fin = true;
  var p = NIV[nivelK].p, extra = Math.max(0, S.mov - p);
  var pts = Math.max(p * 10, p * 30 - extra * 8);
  M.celebrar("memorice", {puntos:pts, gano:true, detalle: p + " parejas en " + S.mov + " movimientos"}, repartir);
}
function cifras(){
  $("mov").textContent = S.mov;
  $("pares").textContent = (S.hechas.length/2) + "/" + NIV[nivelK].p;
  $("tiempo").textContent = M.reloj(S.t);
}
$("nuevo").onclick = repartir;
setInterval(function(){ if(S && !S.fin && S.mov > 0 && !document.hidden){ S.t++; $("tiempo").textContent = M.reloj(S.t); } }, 1000);
repartir();
})();
</script>
</body>
</html>
