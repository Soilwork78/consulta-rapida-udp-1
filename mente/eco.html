<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Eco de Luces</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/comun.css">
<script src="assets/comun.js"></script>
<style>
.zona{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:center}
@media (max-width:820px){.zona{grid-template-columns:minmax(0,1fr)}}
.disco{--d:min(calc(100vw - 48px),460px);width:var(--d);height:var(--d);margin:0 auto;border-radius:50%;background:#140f2a;padding:calc(var(--d) * .04);display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--d) * .03);position:relative;box-shadow:0 30px 60px -25px rgba(20,15,42,.9),inset 0 0 0 4px rgba(255,255,255,.06)}
.pad{border:0;cursor:pointer;opacity:.42;transition:opacity .12s ease,filter .12s ease,transform .12s ease;box-shadow:inset 0 -10px 0 rgba(0,0,0,.18)}
.pad:nth-child(1){background:#22c3b0;border-top-left-radius:100%}
.pad:nth-child(2){background:#ff5d8f;border-top-right-radius:100%}
.pad:nth-child(3){background:#ffc93c;border-bottom-left-radius:100%}
.pad:nth-child(4){background:#6c63ff;border-bottom-right-radius:100%}
.pad.on{opacity:1;filter:brightness(1.25) saturate(1.2);transform:scale(.985)}
.pad:disabled{cursor:default}
.centro{position:absolute;inset:31%;border-radius:50%;background:var(--card);border:6px solid #140f2a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.centro b{font:900 calc(var(--d) * .1) var(--f-disp);line-height:1;color:var(--juego)}
.centro small{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.centro button{margin-top:6px;min-height:36px;padding:4px 12px;font-size:14px}
.lado{display:flex;flex-direction:column;gap:14px}
.info{padding:16px}
.info p{margin:0 0 6px;color:var(--muted)}
.estado{font-family:var(--f-disp);font-size:24px;margin:0 0 6px}
.vidas{display:flex;gap:6px}
.vidas i{width:16px;height:16px;border-radius:50%;background:var(--juego)}
.vidas i.gastada{background:var(--bg2)}
</style>
</head>
<body>
<div id="mente-bar"></div>
<main class="mjuego">
  <div class="mjuego-head">
    <div><h1>Eco de Luces</h1><p>Mira y escucha la secuencia, luego repítela en el mismo orden. Cada ronda suma una luz más y va un poco más rápido.</p></div>
  </div>
  <div class="zona">
    <div class="disco" id="disco">
      <button type="button" class="pad" data-i="0" aria-label="Turquesa" disabled></button>
      <button type="button" class="pad" data-i="1" aria-label="Rosa" disabled></button>
      <button type="button" class="pad" data-i="2" aria-label="Amarillo" disabled></button>
      <button type="button" class="pad" data-i="3" aria-label="Violeta" disabled></button>
      <div class="centro"><b id="nivel">0</b><small>Largo</small><button type="button" class="mbtn mbtn-pri" id="comenzar">Comenzar</button></div>
    </div>
    <div class="lado">
      <div class="mcard info">
        <p class="estado" id="estado">Cuando quieras</p>
        <p id="sub">Tienes dos vidas: si te equivocas, la secuencia se repite una vez.</p>
        <div class="vidas" id="vidas"><i></i><i></i></div>
      </div>
      <div class="mcard info">
        <div class="mfila" style="justify-content:space-around">
          <div class="mstat"><b id="record">0</b><small>Tu récord</small></div>
          <div class="mstat"><b id="ultimo">—</b><small>Última partida</small></div>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
(function(){
"use strict";
var M = window.Mente; M.barra("eco");
var $ = function(id){ return document.getElementById(id); };
var NOTAS = [329.6, 440, 554.4, 659.3];
var pads = Array.prototype.slice.call(document.querySelectorAll(".pad"));
var S = null;
var datos = M.leerLocal("mente.eco") || {record:0, ultimo:null};
$("record").textContent = datos.record; $("ultimo").textContent = datos.ultimo == null ? "—" : datos.ultimo;

function esperar(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function encender(i, ms){
  pads[i].classList.add("on"); M.tono(NOTAS[i], ms, "sine", 0.14);
  return esperar(ms).then(function(){ pads[i].classList.remove("on"); });
}
function bloquear(b){ pads.forEach(function(p){ p.disabled = b; }); }
function vidas(){ document.querySelectorAll("#vidas i").forEach(function(v,k){ v.classList.toggle("gastada", k >= S.vidas); }); }

function comenzar(){
  S = { sec:[], paso:0, vidas:2, fin:false };
  $("comenzar").hidden = true; vidas();
  nuevaRonda();
}
function nuevaRonda(){
  S.sec.push(Math.floor(Math.random()*4));
  reproducir();
}
function reproducir(){
  S.paso = 0; bloquear(true);
  $("nivel").textContent = S.sec.length;
  $("estado").textContent = "Observa…";
  var ms = Math.max(240, 560 - S.sec.length * 22), p = esperar(650);
  S.sec.forEach(function(i){ p = p.then(function(){ return encender(i, ms); }).then(function(){ return esperar(ms * 0.35); }); });
  p.then(function(){ if(S.fin) return; $("estado").textContent = "Tu turno"; bloquear(false); });
}
pads.forEach(function(p){
  p.addEventListener("click", function(){
    if(!S || S.fin || p.disabled) return;
    var i = +p.dataset.i;
    encender(i, 200);
    if(i !== S.sec[S.paso]){
      S.vidas--; vidas(); bloquear(true);
      M.tono(120, 380, "sawtooth", 0.06);
      if(S.vidas <= 0) return terminar();
      $("estado").textContent = "¡Ups! Otra vez";
      return esperar(700).then(reproducir);
    }
    S.paso++;
    if(S.paso === S.sec.length){
      bloquear(true); $("estado").textContent = "¡Bien!";
      esperar(500).then(nuevaRonda);
    }
  });
});
function terminar(){
  S.fin = true;
  var logrado = S.sec.length - 1;
  datos.ultimo = logrado; datos.record = Math.max(datos.record, logrado);
  M.guardarLocal("mente.eco", datos);
  $("record").textContent = datos.record; $("ultimo").textContent = logrado;
  $("estado").textContent = "Llegaste a " + logrado + (logrado === 1 ? " luz" : " luces");
  $("comenzar").hidden = false; $("comenzar").textContent = "Otra vez";
  M.celebrar("eco", {puntos: logrado * logrado * 3 + logrado * 10, gano: logrado >= 8, detalle: "Secuencia de " + logrado}, comenzar);
}
$("comenzar").onclick = comenzar;
document.addEventListener("keydown", function(e){ var k = {"1":0,"2":1,"3":2,"4":3}[e.key]; if(k !== undefined) pads[k].click(); });
})();
</script>
</body>
</html>
