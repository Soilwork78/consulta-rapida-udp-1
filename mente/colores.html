<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Colores Traicioneros</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..900,100&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/comun.css">
<script src="assets/comun.js"></script>
<style>
.juego{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.marcador{display:flex;justify-content:space-around;padding:12px}
.tiempo{height:10px;border-radius:999px;background:var(--bg2);overflow:hidden}
.tiempo i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#e8a317,#e4572e);transition:width 1s linear}
.lienzo{position:relative;height:240px;border-radius:24px;background:#16112e;display:grid;place-items:center;overflow:hidden;box-shadow:var(--shadow)}
.lienzo::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 80% at 50% 40%,rgba(255,255,255,.08),transparent)}
.inicio{position:relative;z-index:1}
.palabra{position:relative;font:900 clamp(54px,14vw,96px) var(--f-disp);letter-spacing:.03em;user-select:none}
.palabra.entra{animation:entra .22s cubic-bezier(.2,1.4,.4,1)}
@keyframes entra{from{transform:scale(.7);opacity:.2}}
.lienzo.marco{box-shadow:inset 0 0 0 8px #fff,var(--shadow)}
.lienzo.bien{animation:fbien .35s ease}
.lienzo.mal{animation:fmal .35s ease}
@keyframes fbien{30%{background:#0d4f3a}}
@keyframes fmal{30%{background:#5a1525}}
.combo{position:absolute;top:12px;right:16px;color:#ffd166;font-weight:700;font-size:15px}
.regla{position:absolute;bottom:12px;left:0;right:0;text-align:center;color:#c9c2e8;font-size:14px}
.botones{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.bcolor{display:flex;align-items:center;gap:12px;justify-content:center;min-height:72px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 20px var(--f-body);cursor:pointer;transition:transform .08s ease}
.bcolor:active{transform:scale(.97)}
.bcolor i{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.inicio{text-align:center;padding:28px 20px}
.inicio h2{font-family:var(--f-disp);font-size:30px;margin:0 0 8px}
.inicio p{color:var(--muted);margin:0 auto 18px;max-width:46ch}
.cuenta{font:900 120px var(--f-disp);color:#ffd166}
</style>
</head>
<body>
<div id="mente-bar"></div>
<main class="mjuego">
  <div class="mjuego-head">
    <div><h1>Colores Traicioneros</h1><p>La palabra dice un color y está pintada de otro. Responde el color de la <b>tinta</b>, lo más rápido que puedas, durante 45 segundos.</p></div>
    <div class="mseg" id="modos" role="group" aria-label="Modo">
      <button type="button" data-m="0" aria-pressed="true">Clásico</button>
      <button type="button" data-m="1" aria-pressed="false">Flexible</button>
    </div>
  </div>
  <div class="juego">
    <div class="mcard marcador">
      <div class="mstat"><b id="aciertos">0</b><small>Aciertos</small></div>
      <div class="mstat"><b id="errores">0</b><small>Errores</small></div>
      <div class="mstat"><b id="rt">—</b><small>Reacción media</small></div>
      <div class="mstat"><b id="seg">45</b><small>Segundos</small></div>
    </div>
    <div class="tiempo"><i id="barra"></i></div>
    <div class="lienzo" id="lienzo">
      <div class="inicio" id="inicio">
        <h2 style="color:#fff">¿Listo?</h2>
        <p style="color:#c9c2e8" id="explica">Ignora lo que dice la palabra y fíjate en el color con que está escrita.</p>
        <button type="button" class="mbtn mbtn-pri" id="comenzar">Comenzar</button>
      </div>
    </div>
    <div class="botones" id="botones"></div>
  </div>
</main>
<script>
(function(){
"use strict";
var M = window.Mente; M.barra("colores");
var $ = function(id){ return document.getElementById(id); };
var COL = [{n:"ROJO",c:"#ff4d6d"},{n:"AZUL",c:"#4d8dff"},{n:"VERDE",c:"#2fd07a"},{n:"AMARILLO",c:"#ffd23f"}];
var DUR = 45, modo = 0, S = null, reloj = null;

COL.forEach(function(c,i){
  var b = document.createElement("button"); b.type="button"; b.className="bcolor"; b.dataset.i=i;
  b.innerHTML = '<i style="background:'+c.c+'"></i>' + c.n.charAt(0) + c.n.slice(1).toLowerCase();
  b.onclick = function(){ responder(+this.dataset.i); };
  $("botones").appendChild(b);
});
document.querySelectorAll("#modos button").forEach(function(b){
  b.onclick = function(){
    if(S && !S.fin) return;
    modo = +b.dataset.m;
    document.querySelectorAll("#modos button").forEach(function(x){ x.setAttribute("aria-pressed", x===b ? "true" : "false"); });
    $("explica").textContent = modo ? "Si la tarjeta tiene marco blanco, responde lo que dice la palabra. Sin marco, responde la tinta." : "Ignora lo que dice la palabra y fíjate en el color con que está escrita.";
  };
});

function comenzar(){
  S = { aciertos:0, errores:0, tiempos:[], combo:0, mejorCombo:0, quedan:DUR, fin:false, actual:null, t0:0 };
  marcador();
  var n = 3, lz = $("lienzo");
  lz.innerHTML = '<div class="cuenta">3</div>';
  var cd = setInterval(function(){
    n--; M.tono(500 + (3-n)*120, 120);
    if(n > 0) lz.querySelector(".cuenta").textContent = n;
    else { clearInterval(cd); arrancar(); }
  }, 700);
}
function arrancar(){
  $("lienzo").innerHTML = '<span class="combo" id="combo"></span><div class="palabra" id="palabra"></div><div class="regla" id="regla"></div>';
  siguiente();
  reloj = setInterval(function(){
    S.quedan--; marcador();
    if(S.quedan <= 0) terminar();
  }, 1000);
}
function siguiente(){
  var w = Math.floor(Math.random()*4), tinta;
  do { tinta = Math.floor(Math.random()*4); } while(Math.random() < 0.75 && tinta === w);
  var marco = modo === 1 && Math.random() < 0.35;
  S.actual = { w:w, tinta:tinta, marco:marco, resp: marco ? w : tinta };
  var p = $("palabra");
  p.textContent = COL[w].n; p.style.color = COL[tinta].c;
  p.classList.remove("entra"); void p.offsetWidth; p.classList.add("entra");
  $("lienzo").classList.toggle("marco", marco);
  $("regla").textContent = modo ? (marco ? "Marco: responde la palabra" : "Responde la tinta") : "";
  S.t0 = performance.now();
}
function responder(i){
  if(!S || S.fin || !S.actual || !$("palabra")) return;
  var lz = $("lienzo");
  if(i === S.actual.resp){
    S.aciertos++; S.combo++; S.mejorCombo = Math.max(S.mejorCombo, S.combo);
    S.tiempos.push(performance.now() - S.t0);
    M.tono(560 + Math.min(S.combo,10)*30, 70, "sine", 0.05);
    lz.classList.remove("bien","mal"); void lz.offsetWidth; lz.classList.add("bien");
  } else {
    S.errores++; S.combo = 0;
    M.tono(150, 160, "square", 0.05);
    lz.classList.remove("bien","mal"); void lz.offsetWidth; lz.classList.add("mal");
  }
  $("combo").textContent = S.combo >= 5 ? "Racha ×" + S.combo : "";
  marcador(); siguiente();
}
function marcador(){
  $("aciertos").textContent = S.aciertos; $("errores").textContent = S.errores; $("seg").textContent = S.quedan;
  $("barra").style.width = (100 * S.quedan / DUR) + "%";
  if(S.tiempos.length){ var m = S.tiempos.reduce(function(a,b){ return a+b; },0) / S.tiempos.length; $("rt").textContent = (m/1000).toFixed(2) + " s"; }
}
function terminar(){
  clearInterval(reloj); S.fin = true;
  var pts = Math.max(0, S.aciertos*10 - S.errores*5 + S.mejorCombo*2) * (modo ? 1.3 : 1);
  $("lienzo").classList.remove("marco");
  $("lienzo").innerHTML = '<div class="inicio"><h2 style="color:#fff">Tiempo</h2><p style="color:#c9c2e8">'+S.aciertos+' aciertos y '+S.errores+' errores.</p><button type="button" class="mbtn mbtn-pri" id="comenzar">Otra ronda</button></div>';
  $("comenzar").onclick = comenzar;
  var prec = S.aciertos + S.errores ? Math.round(100*S.aciertos/(S.aciertos+S.errores)) : 0;
  M.celebrar("colores", {puntos: pts, gano: S.aciertos >= 25 && prec >= 85, detalle: prec + "% de precisión · " + $("rt").textContent + " por respuesta"}, comenzar);
}
document.addEventListener("keydown", function(e){
  var k = {"1":0,"2":1,"3":2,"4":3,"r":0,"a":1,"v":2,"m":3}[e.key.toLowerCase()];
  if(k !== undefined) responder(k);
});
$("comenzar").onclick = comenzar;
})();
</script>
</body>
</html>
